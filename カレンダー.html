<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ガキ鉄収録予定カレンダー</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(to bottom, #fff0f8, #ffe4f0);
            color: #000;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 15px 40px rgba(255, 182, 193, 0.6);
        }
        h1 {
            font-size: 2.8em;
            margin: 0 0 20px;
            text-shadow: 3px 3px 6px #ffb6c1;
            text-align: center;
        }
        h1::before { content: "❤ "; font-size: 1.2em; }
        h1::after { content: " ❤"; font-size: 1.2em; }
        #auth-status {
            text-align: center;
            margin: 10px 0;
            font-size: 1.1em;
        }
        #login-btn, #logout-btn {
            background: #d1478a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            margin: 0 5px;
        }
        #logout-btn { background: #ff69b4; }
        #month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 1.6em;
            font-weight: bold;
        }
        #month-nav button {
            background: #ff99cc;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5em;
            cursor: pointer;
        }
        .table-wrapper { overflow-x: auto; border-radius: 20px; }
        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            background: #fffafa;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
        }
        th { background: #ffcccb; padding: 12px; font-size: 1.2em; }
        td {
            height: 120px;
            border: 2px solid #ffb6c1;
            vertical-align: top;
            position: relative;
            cursor: default;
        }
        td.other-month { opacity: 0.4; }
        td.today { background: #ffccff !important; }
        .day-number { font-size: 1.6em; font-weight: bold; padding: 8px; }
        .mark { 
            position: absolute; 
            bottom: 8px; 
            right: 10px; 
            font-size: 3em; 
            pointer-events: none;
            text-shadow: 2px 2px 4px #ffb6c1;
        }
        th:nth-child(7), td:nth-child(7) { color: #e63946; }
        th:nth-child(6), td:nth-child(6) { color: #4361ee; }
        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            #month-nav { font-size: 1.4em; }
            .day-number { font-size: 1.4em; }
            .mark { font-size: 2.5em; }
            td { height: 100px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ガキ鉄収録予定カレンダー</h1>
        <div id="auth-status">ログインしてね❤</div>
        <div style="text-align:center; margin:10px 0;">
            <button id="login-btn">ログイン</button>
            <button id="logout-btn" style="display:none;">ログアウト</button>
        </div>
        <div id="month-nav">
            <button id="prev-month">〈</button>
            <span id="current-month"></span>
            <button id="next-month">〉</button>
        </div>
        <div class="table-wrapper">
            <table id="calendar">
                <thead>
                    <tr>
                        <th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th><th>日</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // ★★★ あなたのfirebaseConfigをここに貼ってね ★★★
        const firebaseConfig = {
  apiKey: "AIzaSyDTcnSLeAbmKe8DZj4q8ONjLPcykg5OHXc",
  authDomain: "gakitetu-fe514.firebaseapp.com",
  databaseURL: "https://gakitetu-fe514-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gakitetu-fe514",
  storageBucket: "gakitetu-fe514.firebasestorage.app",
  messagingSenderId: "310761732805",
  appId: "1:310761732805:web:3d78685791e5983d868eac",
  measurementId: "G-KXNX55FKFY"
};
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const eventsRef = db.ref('events');

        let currentUser = null;
        let events = {};

        const months = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();

        const calendarBody = document.querySelector('#calendar tbody');
        const currentMonthSpan = document.getElementById('current-month');
        const authStatus = document.getElementById('auth-status');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        // ログイン状態監視
        auth.onAuthStateChanged((user) => {
            currentUser = user;
            if (user) {
                authStatus.textContent = `ログイン中: ${user.email} ❤（編集できます）`;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
            } else {
                authStatus.textContent = '予定が見れます❤（編集はログインしてね）';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
            }
            renderCalendar();
        });

        // ログイン処理
        loginBtn.onclick = () => {
            const email = prompt('メールアドレスを入力してね:');
            const password = prompt('パスワードを入力してね:');
            if (email && password) {
                auth.signInWithEmailAndPassword(email, password)
                    .catch((error) => alert('ログイン失敗: ' + error.message));
            }
        };

        // ログアウト
        logoutBtn.onclick = () => {
            auth.signOut();
        };

        // データ取得（リアルタイム）
        eventsRef.on('value', (snapshot) => {
            events = snapshot.val() || {};
            renderCalendar();
        });

        function renderCalendar() {
            calendarBody.innerHTML = '';
            const firstDay = new Date(currentYear, currentMonth, 1);
            const todayStr = new Date().toISOString().split('T')[0];

            let startDay = firstDay.getDay();
            if (startDay === 0) startDay = 7;
            const startDate = new Date(firstDay);
            startDate.setDate(firstDay.getDate() - (startDay - 1));

            currentMonthSpan.textContent = `${currentYear}年 ${months[currentMonth]}`;

            let row = document.createElement('tr');
            for (let i = 0; i < 42; i++) {
                const date = new Date(startDate);
                date.setDate(startDate.getDate() + i);
                const dateStr = date.toISOString().split('T')[0];

                const cell = document.createElement('td');
                if (date.getMonth() !== currentMonth) cell.classList.add('other-month');
                if (dateStr === todayStr) cell.classList.add('today');

                const dayDiv = document.createElement('div');
                dayDiv.className = 'day-number';
                dayDiv.textContent = date.getDate();
                cell.appendChild(dayDiv);

                // ❤マーク表示（予定ありの日）
                if (events[dateStr]) {
                    const mark = document.createElement('div');
                    mark.className = 'mark';
                    mark.textContent = '❤';
                    cell.appendChild(mark);
                }

                // ログイン時のみクリックでトグル
                if (currentUser) {
                    cell.style.cursor = 'pointer';
                    cell.onclick = () => {
                        if (events[dateStr]) {
                            eventsRef.child(dateStr).remove();
                        } else {
                            eventsRef.child(dateStr).set(true);
                        }
                    };
                }

                row.appendChild(cell);
                if ((i + 1) % 7 === 0) {
                    calendarBody.appendChild(row);
                    row = document.createElement('tr');
                }
            }
        }

        document.getElementById('prev-month').onclick = () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        };

        document.getElementById('next-month').onclick = () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            renderCalendar();
        };

        renderCalendar();
    </script>
</body>
</html>
