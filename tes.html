<!-- 既存の「お問い合わせフォーム」部分を以下に置き換えてください -->
<details class="section" style="margin-top: 30px;">
    <summary>お問い合わせフォーム</summary>
    <div class="content">
        <form class="contact-form" id="contactForm">
            <label>お名前</label>
            <input type="text" id="name" placeholder="お名前を入力してください">

            <label>メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" placeholder="example@email.com" required>

            <label>件名 <span class="required">*</span></label>
            <input type="text" id="subject" placeholder="件名を入力してください" required>

            <label>依頼概要</label>
            <textarea id="summary" placeholder="依頼の概要を簡潔に記載してください"></textarea>

            <label>本文</label>
            <textarea id="body" placeholder="詳細な内容をお書きください" required></textarea>

            <button type="button" onclick="sendMail()">メールで送信</button>
        </form>
        <p style="font-size: 0.9em; margin-top: 15px; color: #666;">
            ※送信ボタンを押すと、お使いのメールソフトが起動します。<br>
            内容をご確認の上、送信してください。<br>
            <strong>※文字化け対策済みです</strong>（日本語が正しく表示されるはずです）。
        </p>
    </div>
</details>

<script>
// 追加するJavaScript関数（ページの既存<script>内に追加してください）
function sendMail() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const summary = document.getElementById('summary').value.trim();
    const body = document.getElementById('body').value.trim();

    if (!email || !subject || !body) {
        alert('必須項目（メールアドレス・件名・本文）を入力してください。');
        return;
    }

    // 本文をまとめる（必要に応じて改行を入れる）
    let fullBody = '';
    if (name) fullBody += `お名前: ${name}\n`;
    if (email) fullBody += `メールアドレス: ${email}\n\n`;
    if (summary) fullBody += `依頼概要:\n${summary}\n\n`;
    fullBody += `本文:\n${body}`;

    // 正しくエンコード
    const encodedSubject = encodeURIComponent(subject);
    const encodedBody = encodeURIComponent(fullBody);

    // mailtoリンク生成
    const mailtoLink = `mailto:baccag0han@gmail.com?subject=${encodedSubject}&body=${encodedBody}`;

    // メールソフト起動
    window.location.href = mailtoLink;
}
</script>
